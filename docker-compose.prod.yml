# Production docker-compose setup with Oracle Impact Analyzer backend + Neo4j + reverse proxy
# Usage: docker-compose -f docker-compose.prod.yml up -d

version: '3.8'

services:
  neo4j:
    image: neo4j:5-community
    container_name: oracle-impact-neo4j-prod
    ports:
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changepassword}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2g
    volumes:
      - neo4j_data_prod:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-changepassword} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped
    networks:
      - oracle-impact-network

  app:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-org/oracle-impact-analyzer}:latest
    container_name: oracle-impact-app-prod
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "3010:3010"
    environment:
      NODE_ENV: production
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changepassword}
      # Optional: Oracle database connection
      # ORACLE_CONNECT_STRING: ${ORACLE_CONNECT_STRING}
      # ORACLE_USER: ${ORACLE_USER}
      # ORACLE_PASSWORD: ${ORACLE_PASSWORD}
    volumes:
      - ./uploads:/app/uploads  # Persist uploaded artifacts
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3010"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - oracle-impact-network

volumes:
  neo4j_data_prod:
  neo4j_logs:

networks:
  oracle-impact-network:
    driver: bridge

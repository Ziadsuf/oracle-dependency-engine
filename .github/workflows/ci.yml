name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    name: Lint, Type-Check & Test

    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (TypeScript)
        run: npm run lint

      - name: Test (unit + Neo4j integration)
        run: npm test

      - name: Build (Vite + esbuild)
        run: npm run build

  # Validates the image builds on every PR; builds + pushes to GHCR on branch pushes.
  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    name: Docker Build & Push

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR image references must be lowercase (GitHub Actions has no `lower` filter).
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Boots the built image against a real Neo4j and verifies it serves traffic.
  docker-smoke-test:
    runs-on: ubuntu-latest
    needs: docker-build
    name: Docker Smoke Test

    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (load locally)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: oracle-impact:test
          cache-from: type=gha

      - name: Start container
        run: |
          docker run -d --name app --network host \
            -e NODE_ENV=production -e PORT=3010 \
            -e NEO4J_URI=bolt://localhost:7687 \
            -e NEO4J_USER=neo4j -e NEO4J_PASSWORD=testpassword \
            oracle-impact:test

      - name: Wait for health and hit endpoints
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3010/api/health >/dev/null 2>&1; then echo "server is up"; break; fi
            sleep 2
          done
          echo "== /api/health =="; curl -fsS http://localhost:3010/api/health; echo
          echo "== /api/v2/health =="; curl -fsS http://localhost:3010/api/v2/health; echo

      - name: Container logs
        if: always()
        run: docker logs app || true

version: 2
updates:
  # npm dependencies — dev deps grouped into one PR to cut noise.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development

  # GitHub Actions used in the CI/CD workflow.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # Docker base image (node:20-alpine) in the Dockerfile.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
